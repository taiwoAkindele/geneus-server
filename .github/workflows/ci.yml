name: CI

# Pull requests are where review happens; main and dev are what deploys. A push
# to a feature branch with an open PR would otherwise run the same job twice.
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # The suite talks to real PostgreSQL by design: the constraints under test
      # are enforced by PostgreSQL, so running them anywhere else would prove
      # nothing. Each test file creates and drops its own database, which is
      # why the user is the superuser. These credentials are throwaway — the
      # container lives for one job and is reachable only from inside it.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: geneus
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: geneus
        options: >-
          --health-cmd "pg_isready -U geneus -d geneus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5433:5432

      # Legacy (removed in Phase F): the CouchDB suites still run until the
      # last CouchDB code paths are deleted.
      couchdb:
        image: couchdb:3.4
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: devpassword
        ports:
          - 5984:5984

    env:
      POSTGRES_URL: postgres://geneus:devpassword@127.0.0.1:5433/geneus
      COUCHDB_URL: http://127.0.0.1:5984
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: devpassword

    steps:
      - uses: actions/checkout@v4
        with:
          # The shared contract is a submodule; without it nothing resolves.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile: Node runs the TypeScript sources directly,
          # so the runtime version is the build.
          node-version: 24
          cache: npm

      - run: npm ci

      # Polled from the runner rather than declared as a container health check,
      # because the CouchDB image ships no curl — a health command that cannot
      # run would gate nothing and the tests would race the database.
      - name: Wait for CouchDB
        run: timeout 60 bash -c 'until curl -sf http://127.0.0.1:5984/_up > /dev/null; do sleep 2; done'

      - run: npm run typecheck

      - run: npm test
