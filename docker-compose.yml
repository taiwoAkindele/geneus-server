# The reference deployment: PostgreSQL (source of truth), the PowerSync
# service, and the one Node process.
#
# Three ways to run it:
#   development  — `npm run dev` on the host + `npm run sync:up` (postgres and
#                  powersync only); PowerSync reaches the host server's JWKS via
#                  host.docker.internal.
#   full stack   — `docker compose --profile stack up -d` with, in .env,
#                  POWERSYNC_JWKS_URI=http://server:8080/.well-known/jwks.json
#                  and a SIGNING_PRIVATE_KEY (production refuses to start
#                  without one). This is the shape a production host runs.
#   managed PostgreSQL (e.g. Neon) — set POSTGRES_URL, POWERSYNC_SOURCE_URI,
#                  POWERSYNC_STORAGE_URI and POWERSYNC_SSLMODE=verify-full in .env
#                  and start only `powersync` (and `server`); the local postgres
#                  service is simply not used.
services:
  postgres:
    image: postgres:17-alpine
    container_name: geneus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geneus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-geneus}
      # Read by docker/postgres/01-powersync.sh on first start.
      POWERSYNC_DB_PASSWORD: ${POWERSYNC_DB_PASSWORD:-devpassword}
    # PowerSync reads PostgreSQL's write-ahead log, which needs logical
    # decoding switched on from the first start.
    command: ['postgres', '-c', 'wal_level=logical']
    ports:
      # 5433 on the host: 5432 is commonly taken by another local PostgreSQL.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-geneus} -d ${POSTGRES_DB:-geneus}']
      interval: 5s
      timeout: 3s
      retries: 10

  powersync:
    image: journeyapps/powersync-service:1.26.0
    container_name: geneus-powersync
    restart: unless-stopped
    command: ['start', '-r', 'unified']
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      # Default to the local postgres service; a managed PostgreSQL overrides
      # all three (no ?sslmode= in the URIs — PS_SSLMODE carries it).
      PS_SOURCE_URI: ${POWERSYNC_SOURCE_URI:-postgresql://powersync:${POWERSYNC_DB_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-geneus}}
      PS_STORAGE_URI: ${POWERSYNC_STORAGE_URI:-postgresql://powersync:${POWERSYNC_DB_PASSWORD:-devpassword}@postgres:5432/powersync_storage}
      PS_SSLMODE: ${POWERSYNC_SSLMODE:-disable}
      PS_JWKS_URI: ${POWERSYNC_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}
      PS_PORT: '8080'
    extra_hosts:
      # Linux hosts do not resolve host.docker.internal on their own.
      - 'host.docker.internal:host-gateway'
    ports:
      - '8090:8080'
    volumes:
      - ./powersync:/config:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/probes/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 20

  server:
    build: .
    image: geneus-server:local
    container_name: geneus-server
    restart: unless-stopped
    profiles: ['stack']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '8080'
      POSTGRES_URL: ${POSTGRES_URL:-postgres://${POSTGRES_USER:-geneus}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-geneus}}
      # Device-facing: what the PWA is told to connect PowerSync to.
      POWERSYNC_PUBLIC_URL: ${POWERSYNC_PUBLIC_URL:-http://127.0.0.1:8090}
      POWERSYNC_INTERNAL_URL: http://powersync:8080
      POWERSYNC_JWT_AUDIENCE: ${POWERSYNC_JWT_AUDIENCE:-powersync}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SIGNING_PRIVATE_KEY: ${SIGNING_PRIVATE_KEY:-}
    ports:
      # 8081 on the host so it can coexist with `npm run dev` on 8080.
      - '${SERVER_PORT:-8081}:8080'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
