# Local development. PostgreSQL is the source of truth; the PowerSync service
# joins this file in Phase D. CouchDB remains only until Phase F removes the
# last CouchDB code paths and their tests — the server no longer uses it.
services:
  postgres:
    image: postgres:17-alpine
    container_name: geneus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geneus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-geneus}
    # PowerSync reads PostgreSQL's write-ahead log (Phase D), which needs
    # logical decoding switched on from the first start.
    command: ['postgres', '-c', 'wal_level=logical']
    ports:
      # 5433 on the host: 5432 is commonly taken by another local PostgreSQL.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-geneus} -d ${POSTGRES_DB:-geneus}']
      interval: 5s
      timeout: 3s
      retries: 10

  couchdb:
    image: couchdb:3.4
    container_name: geneus-couchdb
    restart: unless-stopped
    profiles: ['legacy']
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-devpassword}
    ports:
      - '5984:5984'
    volumes:
      - couchdb-data:/opt/couchdb/data

volumes:
  postgres-data:
  couchdb-data:
