      FROM appointments
      WHERE facility_id = auth.parameter('facility_id')
  register_definitions:
    auto_subscribe: true
    query: |
      SELECT id, facility_id AS "facilityId", schema_version AS "schemaVersion", created_by AS "createdBy", created_on AS "createdOn", device_id AS "deviceId", updated_by AS "updatedBy", updated_on AS "updatedOn", register_id AS "registerId", version, name, category, description, status, fields
