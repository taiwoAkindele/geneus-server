# GENERATED from the shared contract by `npm run sync:config` — do not edit by hand.
# One stream per synced record type, every contract column aliased to its
# contract name, filtered to the facility in the device's sync token. See
# src/sync/syncConfig.ts for why it is generated and SCHEMA.md §6 for the rule.
config:
  edition: 3

streams:
  patients:
    auto_subscribe: true
    query: |
      SELECT id, facility_id AS "facilityId", schema_version AS "schemaVersion", created_by AS "createdBy", created_on AS "createdOn", device_id AS "deviceId", updated_by AS "updatedBy", updated_on AS "updatedOn", patient_id AS "patientId", full_name AS "fullName", address, sex, date_of_birth AS "dateOfBirth", dob_estimated AS "dobEstimated", age_years AS "ageYears", occupation, religion, allergies, phone, nin, legacy_paper_ref AS "legacyPaperRef"
      FROM patients
      WHERE facility_id = auth.parameter('facility_id')
  visits:
    auto_subscribe: true
    query: |
      SELECT id, facility_id AS "facilityId", schema_version AS "schemaVersion", created_by AS "createdBy", created_on AS "createdOn", device_id AS "deviceId", updated_by AS "updatedBy", updated_on AS "updatedOn", patient_id AS "patientId", unit_id AS "unitId", visit_date AS "visitDate", setting, symptoms, diagnosis, treatment, referral_id AS "referralId", notes
